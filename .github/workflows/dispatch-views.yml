# Redraw the dispatch views page, Monday, Wednesday and Friday.
#
# WHAT THIS ACTUALLY CHANGES. The input, data/dispatch-events.csv, is a
# committed file and this job does not touch it, so the numbers on the page are
# the same on Wednesday as they were on Monday. What changes is the build stamp
# and, derived from it, the edition: the camera angle, the ground plane
# elevation, the lighting direction, the mark used for the nights figure, the
# sort order of the ranked bars, and the order the sections appear in. The page
# is meant to be drawn differently every time it is published, and this is the
# job that publishes it.
#
# It follows that a failed run is not a data outage. Nothing goes stale and no
# figure is wrong; the page simply keeps last edition's drawing until the next
# run. Do not page anyone over it.
#
# WHY ELEVEN HUNDRED UTC AND NOT SOMETHING TIDIER. GitHub cron is UTC and the
# page's stamp is America/New_York, so the two have to be reconciled or the
# stamp lands on a different weekday than the schedule promises. 11:00 UTC is
# 07:00 Eastern in summer and 06:00 in winter: the same calendar day and the
# same weekday on both sides of the daylight saving boundary, with five hours of
# margin either way. An early-morning UTC time such as 02:00 would be the
# PREVIOUS evening in Eastern, so a "Monday" run would stamp itself Sunday and
# compute Sunday's edition. Do not move this into the 00:00-04:59 UTC band.
#
# SCHEDULES ONLY RUN FROM THE DEFAULT BRANCH. Editing this file on a feature
# branch changes nothing until it is merged to main.
name: Dispatch views

on:
  schedule:
    - cron: "0 11 * * 1,3,5"
  workflow_dispatch:

# A rebuild commits to main, so two of them overlapping would race on the same
# file. Queue rather than cancel: the in-flight one is already most of the way
# to a valid commit.
concurrency:
  group: dispatch-views
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies to install. The build script is standard library only
      # (csv, json, datetime, zoneinfo) by design, so that a reader who
      # downloads the CSV can run it without setting anything up.
      - name: Rebuild data/dispatch-views.json
        run: python3 data/build-dispatch-views.py

      - name: Commit the new edition
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The stamp carries the build date, so on a scheduled run this file
          # always differs. The guard is here for a manual re-run on a day that
          # has already been published, where committing nothing is correct.
          if git diff --quiet -- data/dispatch-views.json; then
            echo "Already built for $(date -u +%F). Nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          edition=$(python3 -c "import json;print(json.load(open('data/dispatch-views.json'))['composition']['edition'])")
          git add data/dispatch-views.json
          git commit -m "Redraw the dispatch views page, edition ${edition}"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # PUSHING TO main DOES NOT DEPLOY THIS SITE. The Vercel project has no Git
      # integration connected, so a commit reaching main updates the repository
      # and nothing else: emr-inc.net goes on serving whatever tree was last
      # deployed by hand. Without this step the page would keep last edition's
      # drawing forever while git looked healthy, which is the worst kind of
      # failure because every status check stays green.
      #
      # A deploy hook is a URL that, when POSTed to, builds a named branch. It
      # carries its own authorisation in the path, so it IS a credential: keep it
      # in the secret, never echo it, and do not add curl -v to debug this step.
      #
      # If the secret is absent the step warns and passes rather than failing.
      # The redraw itself succeeded and is committed; a red run here would say
      # "the build broke" when what actually happened is "nobody has wired the
      # deploy yet", and the annotation says exactly that instead.
      - name: Deploy the new edition to emr-inc.net
        if: steps.commit.outputs.pushed == 'true'
        shell: bash
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_HOOK_URL" ]]; then
            echo "::warning title=Committed but not deployed::The new edition is on main, but the secret VERCEL_DEPLOY_HOOK_URL is not set, so emr-inc.net still shows the previous edition. Set the secret, or run a deployment by hand."
            exit 0
          fi
          # curl's own exit code is folded into the status check so that a network
          # failure and an HTTP error take the same path. Without the `|| code=000`
          # the `set -e` above would kill the step first and the message below,
          # which is the only line that says what went wrong, would never print.
          code=$(curl -sS -X POST -o /dev/null -w '%{http_code}' "$DEPLOY_HOOK_URL") || code="000"
          if [[ "$code" != "200" && "$code" != "201" ]]; then
            echo "Deploy hook returned HTTP $code." >&2
            exit 1
          fi
          echo "Deploy hook accepted (HTTP $code). The build runs on Vercel; this job does not wait for it."
