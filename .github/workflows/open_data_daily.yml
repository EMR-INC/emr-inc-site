name: Daily open-data publication

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Paired triggers plus the New York gate keep publication at 08:00 ET.
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"

permissions:
  contents: write

concurrency:
  group: daily_open_data_publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check Eastern publication window
        id: window
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          eastern_hour="$(TZ=America/New_York date +%H)"
          if [[ "$eastern_hour" == "08" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install read-only source dependencies
        if: steps.window.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check google-auth requests openpyxl

      - name: Build verified research and data art
        if: steps.window.outputs.run == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OHPAH_CALL_SHEET_ID: ${{ vars.OHPAH_CALL_SHEET_ID }}
        run: python scripts/update_research.py

      - name: Verify generated browser scripts
        if: steps.window.outputs.run == 'true'
        run: node scripts/validate_generated.mjs

      - name: Commit refreshed public artifacts
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          git add data/research.json research.html open-data.html
          if git diff --cached --quiet; then
            echo "No public research change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh daily open-data report"
          git push
