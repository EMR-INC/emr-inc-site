name: Daily open-data publication

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Paired triggers plus the New York gate keep publication at 08:00 ET.
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"

permissions:
  contents: write

concurrency:
  group: daily_open_data_publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check Eastern publication window
        id: window
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          eastern_hour="$(TZ=America/New_York date +%H)"
          if [[ "$eastern_hour" == "08" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: "3.12"


      - name: Build verified research and data art
        if: steps.window.outputs.run == 'true'
        env:
          OHPAH_OPEN_DATA_SOURCE_URL: ${{ vars.OHPAH_OPEN_DATA_SOURCE_URL || 'https://spotlight.ohpah.app/api/open-data-snapshot' }}
        run: python scripts/update_research.py

      - name: Verify generated browser scripts
        if: steps.window.outputs.run == 'true'
        run: node scripts/validate_generated.mjs

      - name: Commit refreshed public artifacts
        id: commit
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          git add data/research.json research.html open-data.html
          if git diff --cached --quiet; then
            echo "No public research change"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh daily open-data report"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # The Vercel project has no Git integration, so a commit on main updates
      # the repository and nothing else. Without this step research.html would go
      # on claiming it is refreshed daily while the live page froze on whichever
      # tree was last deployed by hand -- a claim that becomes false on the site
      # before it becomes false in git, which is precisely the failure this page
      # exists to not commit.
      #
      # A deploy hook would be shorter, but Vercel will not create one until the
      # project is connected to a Git repository, and that is blocked on an
      # identity mismatch: the Vercel account's GitHub login is not a member of
      # the EMR-INC org that owns this repo. The CLI needs neither, so it avoids
      # granting a second identity standing access to the org for a build.
      #
      # See dispatch-views.yml for the long version of the reasoning; the two
      # steps are deliberately identical so they cannot drift apart.
      #
      # If Git integration is ever connected, DELETE this step, or every refresh
      # will build to production twice.
      #
      # The token is read from the environment rather than passed as `--token`,
      # so it never reaches argv. Do not echo it and do not add `set -x`.
      #
      # An absent secret warns instead of failing: the refresh itself worked and
      # is committed, and a red run would misreport an unwired deploy as a broken
      # build.
      - name: Deploy the refreshed report to emr-inc.net
        if: steps.commit.outputs.pushed == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_rwxqo0kDlEjDlDdXAJv9y7e6
          VERCEL_PROJECT_ID: prj_kiJjgBMbwd070fbCefZ3zz1Uv9E4
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::warning title=Committed but not deployed::The refreshed report is on main, but the secret VERCEL_TOKEN is not set, so emr-inc.net still shows the previous figures. Set the secret, or run a deployment by hand."
            exit 0
          fi
          npx --yes vercel@60 deploy --prod --yes

