<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">The pulse between: seven day cardiac arrest and radio documented ROSC study</title>
<desc id="desc">Sixty one deduplicated cardiac arrest incidents and two explicit radio documented ROSC declarations from September 20 through September 26, 2026.</desc>
<defs>
  <pattern id="tooth" width="11" height="11" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="3" r="0.7" fill="#10213B" opacity="0.055"/>
    <circle cx="8" cy="7" r="0.45" fill="#D5222A" opacity="0.045"/>
  </pattern>
  <style>
    .display{font-family:'Archivo Black','Arial Black',sans-serif;font-weight:900;fill:#10213B}
    .head{font-family:'Archivo',Arial,sans-serif;font-weight:700;fill:#10213B}
    .body{font-family:'Archivo',Arial,sans-serif;font-weight:400;fill:#10213B}
    .mono{font-family:'Courier Prime','Courier New',monospace;fill:#10213B}
    .day{font-family:'Courier Prime','Courier New',monospace;font-size:17px;font-weight:700;letter-spacing:1.8px;fill:#10213B}
    .count{font-family:'Archivo Black','Arial Black',sans-serif;font-size:34px;font-weight:900;fill:#10213B}
    .micro{font-family:'Courier Prime','Courier New',monospace;font-size:10px;font-weight:700;letter-spacing:1.4px;fill:#10213B}
  </style>
</defs>

